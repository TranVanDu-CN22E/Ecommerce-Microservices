syntax = "proto3";

option csharp_namespace = "IdentityShared.Protos";

import "google/protobuf/timestamp.proto";

package identity;

service UserGrpcService {
    rpc GetUserById (GetUserByIdRequest) returns (GetUserByIdResponse);
}

message GetUserByIdRequest {
    string user_id = 1;
}

message GetUserByIdResponse {
    UserDto user = 1;
    bool success = 2;
    repeated string errors = 3;
}

message UserDto {
    string user_id = 1;
    string email = 2;
    string phone = 3;
    string user_name = 4;
    bool is_locked = 5;
    bool is_banned = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp locked_until = 8;
    google.protobuf.Timestamp banned_until = 9;
    repeated UserRoleDto user_roles = 10;
}

message UserRoleDto {
    string id = 1;           // UserRole.Id (Guid)
    string user_id = 2;      // UserRole.UserId
    string role_id = 3;      // UserRole.RoleId
}