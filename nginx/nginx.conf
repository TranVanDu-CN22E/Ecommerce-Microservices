user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Định nghĩa vùng nhớ cache cho ảnh (bắt buộc phải có khi dùng proxy_cache_valid)
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream yarp_gateway {
        server api-gateway:80;
    }

    # Upstream riêng cho catalog để dễ quản lý
    upstream catalog_service {
        server catalog-api:8080;
    }

    # Server HTTP chuyển hướng sang HTTPS
    server {
        listen 80;
        server_name api.localhost;
        
        # Cho phép truy cập uploads qua HTTP nếu cần test, hoặc redirect hết sang HTTPS
        location /uploads/ {
            proxy_pass http://catalog_service;
            proxy_set_header Host $host;
            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Server HTTPS chính
    server {
        listen 443 ssl;
        server_name api.localhost;

        ssl_certificate /etc/nginx/certs/api.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/api.localhost-key.pem;
        client_max_body_size 10M; 
        
        root /usr/share/nginx/html;
        index index.html;

        # ==== UPLOADS (STATIC FILES) ====
        # Ưu tiên xử lý ảnh trước khi vào logic API phức tạp
        location /uploads/ {
            proxy_pass http://catalog_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Bật cache để giảm tải cho backend
            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Tối ưu thời gian chờ cho việc tải file lớn
            proxy_read_timeout 300;
        }

        # ==== BACKEND API ====
        location /api/ {
            proxy_pass http://yarp_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ==== FRONTEND ====
        location / {
            try_files $uri /index.html;
        }
    }
}